name: Build Linux App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - 'client/Magnus-Laser/**'
      - '.github/workflows/build-linux.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'client/Magnus-Laser/**'
      - '.github/workflows/build-linux.yml'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/Magnus-Laser/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install frontend dependencies
        working-directory: ./client/Magnus-Laser
        run: npm install

      - name: Build frontend
        working-directory: ./client/Magnus-Laser
        run: npm run build

      - name: Build Tauri app for Linux
        working-directory: ./client/Magnus-Laser
        run: npm run tauri:build:linux
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          CARGO_NET_GIT_FETCH_WITH_CLI: true
          # Increase memory limit for Rust compilation
          CARGO_BUILD_JOBS: 2

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magnus-laser-linux
          path: |
            client/Magnus-Laser/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.deb
            client/Magnus-Laser/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.AppImage
            client/Magnus-Laser/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.tar.gz

